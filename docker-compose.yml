version: '3.8'

services:
  graden-ia:
    build: .
    container_name: graden-ia
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - WEBUI_NAME=Graden IA
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=changez-moi-en-production
      - DATA_DIR=/app/data
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
